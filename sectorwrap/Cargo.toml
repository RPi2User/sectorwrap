[package]
name = "sectorwrap"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "sectorwrap"

[features]
default = []
ublk = ["dep:libublk", "dep:env_logger", "dep:log"]

[[bin]]
name = "sectorwrap-ublk"
path = "src/bin/sectorwrap-ublk.rs"
required-features = ["ublk"]

[dependencies]
sectorwrap-core = { path = "../sectorwrap-core" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
libublk = { version = "0.4.8", optional = true }
env_logger = { version = "0.11", optional = true }
log = { version = "0.4", optional = true }
